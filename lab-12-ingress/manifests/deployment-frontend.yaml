# manifests/deployment-frontend.yaml
# Frontend application (simulates a React/Vue web frontend)
# Dùng nginx để serve static content

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: web
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
        version: "1.0"
    spec:
      containers:
        - name: frontend
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
          # ConfigMap để custom nginx response (giả lập frontend content)
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-config
        - name: html-content
          configMap:
            name: frontend-html

---
# ConfigMap cho nginx configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header X-App "frontend";
            add_header X-Version "1.0";
        }
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

---
# ConfigMap cho HTML content
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Frontend App - Lab 12</title></head>
    <body>
      <h1>🎨 Frontend Application</h1>
      <p>This is the <strong>frontend</strong> service.</p>
      <p>Route: <code>/</code></p>
      <p>Lab: Kubernetes Ingress</p>
    </body>
    </html>
