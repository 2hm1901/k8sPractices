apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        # all-in-one: collector + query + UI trong một container (dev only!)
        image: jaegertracing/all-in-one:1.52
        ports:
        - containerPort: 16686  # Jaeger UI
          name: ui
        - containerPort: 14268  # HTTP collector
          name: collector-http
        - containerPort: 4317   # OTLP gRPC
          name: otlp-grpc
        - containerPort: 4318   # OTLP HTTP
          name: otlp-http
        - containerPort: 6831   # Jaeger thrift UDP (legacy)
          protocol: UDP
          name: jaeger-thrift
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: COLLECTOR_ZIPKIN_HOST_PORT
          value: ":9411"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
