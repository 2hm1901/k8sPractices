# Example SealedSecret (generated by kubeseal)
# DO NOT create this manually — use: kubeseal --format yaml < secret.yaml > sealedsecret.yaml
# This is just a structural example showing what a SealedSecret looks like
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: my-db-secret
  namespace: default
  annotations:
    # sealedsecrets.bitnami.com/cluster-wide: "true"  # uncomment for cluster-wide scope
spec:
  encryptedData:
    # These values are encrypted with the cluster's public key
    # They look like random strings and are safe to commit to Git!
    username: AgBy8hCM...  # encrypted "admin"
    password: AgCx7kNP...  # encrypted "supersecret123"
  template:
    metadata:
      name: my-db-secret
      namespace: default
    type: Opaque
