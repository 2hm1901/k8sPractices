# SecretStore sử dụng Fake provider (để test không cần external system)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fake-secret-store
  namespace: default
spec:
  provider:
    fake:
      data:
      - key: "/myapp/database/username"
        value: "admin"
      - key: "/myapp/database/password"
        value: "productionpassword123"
      - key: "/myapp/api/key"
        value: "api-key-xyz-987"
