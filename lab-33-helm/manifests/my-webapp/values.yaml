# =============================================================================
# values.yaml — Default configuration for my-webapp Helm chart
# Override these values with:
#   helm install my-app . -f custom-values.yaml
#   helm install my-app . --set key=value
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings (propagated to sub-charts)
# ---------------------------------------------------------------------------
global:
  imageRegistry: ""              # Override image registry for all images
  imagePullSecrets: []           # Global image pull secrets
  storageClass: ""               # Global storage class

# ---------------------------------------------------------------------------
# Replica count
# ---------------------------------------------------------------------------
replicaCount: 2

# ---------------------------------------------------------------------------
# Container Image
# ---------------------------------------------------------------------------
image:
  repository: nginx
  pullPolicy: IfNotPresent       # Always | Never | IfNotPresent
  # tag: Overrides the image tag. Default: Chart.yaml appVersion
  tag: "1.25.3"

imagePullSecrets: []
# - name: my-registry-secret

# ---------------------------------------------------------------------------
# Application name override
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  automount: true
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-role
  name: ""                       # Leave empty to auto-generate

# ---------------------------------------------------------------------------
# Pod annotations and labels
# ---------------------------------------------------------------------------
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podLabels:
  app.kubernetes.io/version: "1.0.0"
  environment: "production"

# ---------------------------------------------------------------------------
# Pod Security Context
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# Container Security Context
# ---------------------------------------------------------------------------
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Service configuration
# ---------------------------------------------------------------------------
service:
  type: ClusterIP               # ClusterIP | NodePort | LoadBalancer
  port: 80
  targetPort: 8080
  # nodePort: 30080             # Only for NodePort type
  annotations: {}
  # service.beta.kubernetes.io/aws-load-balancer-type: nlb

# ---------------------------------------------------------------------------
# Ingress configuration
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  # nginx.ingress.kubernetes.io/rate-limit: "100"
  host: myapp.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: myapp-tls

# ---------------------------------------------------------------------------
# Resource requests and limits (IMPORTANT: always set these!)
# ---------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# ---------------------------------------------------------------------------
# Liveness and Readiness Probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Pod Disruption Budget
# ---------------------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ---------------------------------------------------------------------------
# Node Selector, Tolerations, Affinity
# ---------------------------------------------------------------------------
nodeSelector: {}
# kubernetes.io/arch: amd64

tolerations: []
# - key: "node-role"
#   operator: "Equal"
#   value: "application"
#   effect: "NoSchedule"

affinity: {}
# podAntiAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#   - labelSelector:
#       matchExpressions:
#       - key: app.kubernetes.io/name
#         operator: In
#         values:
#         - my-webapp
#     topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Application Configuration (environment variables via ConfigMap)
# ---------------------------------------------------------------------------
config:
  LOG_LEVEL: "info"
  APP_ENV: "production"
  PORT: "8080"
  MAX_CONNECTIONS: "100"

# Extra environment variables (sensitive → use secrets or externalSecrets)
extraEnv: []
# - name: DATABASE_URL
#   valueFrom:
#     secretKeyRef:
#       name: db-secret
#       key: url

# ---------------------------------------------------------------------------
# Volumes and VolumeMounts (for read-only root filesystem)
# ---------------------------------------------------------------------------
extraVolumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache/nginx

# ---------------------------------------------------------------------------
# Dependency: PostgreSQL
# ---------------------------------------------------------------------------
postgresql:
  enabled: false
  auth:
    database: myapp
    username: myapp
    existingSecret: postgres-secret
  primary:
    persistence:
      enabled: true
      size: 10Gi

# ---------------------------------------------------------------------------
# Dependency: Redis
# ---------------------------------------------------------------------------
redis:
  enabled: false
  auth:
    enabled: true
    existingSecret: redis-secret
  master:
    persistence:
      enabled: false

# ---------------------------------------------------------------------------
# Hooks configuration
# ---------------------------------------------------------------------------
hooks:
  preInstall:
    enabled: true
    image: busybox:1.36
    command: ['sh', '-c', 'echo "Pre-install hook: running database migrations"']

# ---------------------------------------------------------------------------
# Init containers
# ---------------------------------------------------------------------------
initContainers: []
# - name: wait-for-db
#   image: busybox:1.36
#   command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for DB..."; sleep 2; done']
