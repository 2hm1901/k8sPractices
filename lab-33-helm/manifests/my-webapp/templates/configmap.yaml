apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "my-webapp.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-webapp.labels" . | nindent 4 }}
data:
  # Iterate over all key-value pairs in .Values.config
  # Using range to dynamically generate all config entries
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Static application metadata
  CHART_NAME: {{ .Chart.Name | quote }}
  CHART_VERSION: {{ .Chart.Version | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  RELEASE_NAME: {{ .Release.Name | quote }}
  RELEASE_NAMESPACE: {{ .Release.Namespace | quote }}
