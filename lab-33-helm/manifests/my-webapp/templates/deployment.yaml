apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-webapp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-webapp.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Không set replicas nếu HPA enabled (HPA sẽ quản lý)
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "my-webapp.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # Tối đa 1 pod vượt quá desired count trong upgrade
      maxUnavailable: 0   # Zero downtime: không xóa pod cũ trước khi pod mới ready
  template:
    metadata:
      # Force pod restart khi configmap thay đổi (checksum annotation)
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "my-webapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Image pull secrets (global + local)
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "my-webapp.serviceAccountName" . }}
      # Pod-level security context
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Grace period: cho phép pod hoàn thành requests hiện tại trước khi terminate
      terminationGracePeriodSeconds: 30
      # Init containers (nếu có)
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # Container-level security context
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "my-webapp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Environment variables từ ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "my-webapp.configMapName" . }}
          # Extra environment variables (sensitive values, secrets)
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Resource requests và limits
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Liveness probe: restart container nếu unhealthy
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Readiness probe: remove từ service endpoints nếu not ready
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Volume mounts (cần thiết khi readOnlyRootFilesystem=true)
          volumeMounts:
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
          # Graceful shutdown: gửi signal SIGTERM, cho phép in-flight requests hoàn thành
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]  # Delay trước khi SIGTERM
      # Volumes
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      # Node scheduling
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
