# alertmanager-config.yaml
# AlertmanagerConfig CRD configures alert routing and notifications
# This is the Prometheus Operator CRD approach (vs ConfigMap approach)

---
# Secret for Slack webhook URL (in production, use proper secret management)
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  # Replace with your actual Slack webhook URL
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  # Replace with your SMTP password
  smtp-password: "your-smtp-password"

---
# AlertmanagerConfig: defines routing for THIS namespace's alerts
# Note: kube-prometheus-stack also has a main AlertManager config
# This CRD creates a sub-route in the main config
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: demo-app-alerting
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  # =====================================================
  # ROUTE: How to route alerts to receivers
  # =====================================================
  route:
    # Group alerts that have the same namespace + alertname together
    groupBy: ['namespace', 'alertname']

    # Wait before sending initial notification (gives time to group)
    groupWait: 30s

    # Wait before sending updates about existing alert group
    groupInterval: 5m

    # Wait before re-sending resolved notification
    repeatInterval: 12h

    # Default receiver
    receiver: 'slack-platform'

    # Child routes (more specific routing)
    routes:
      # Critical alerts go to PagerDuty AND Slack immediately
      - matchers:
          - name: severity
            value: critical
            matchType: "="
        receiver: 'critical-alerts'
        groupWait: 10s         # Shorter wait for critical alerts
        repeatInterval: 1h    # More frequent reminders

      # Warning alerts go to Slack only
      - matchers:
          - name: severity
            value: warning
            matchType: "="
        receiver: 'slack-platform'

      # Alerts from specific team
      - matchers:
          - name: team
            value: platform
            matchType: "="
        receiver: 'slack-platform'

  # =====================================================
  # RECEIVERS: Where to send notifications
  # =====================================================
  receivers:
    # Slack receiver for platform team
    - name: 'slack-platform'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#platform-alerts'
          sendResolved: true

          # Rich message format
          title: '{{ template "slack.default.title" . }}'
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Namespace:* {{ .Labels.namespace }}
            *Started:* {{ .StartsAt | since }}
            {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
            {{ end }}
          color: |
            {{ if eq .Status "firing" -}}
              {{ if eq (index .Alerts 0).Labels.severity "critical" }}danger{{ else }}warning{{ end }}
            {{- else -}}good{{- end }}

    # Critical alerts receiver (multiple channels)
    - name: 'critical-alerts'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#incidents'
          sendResolved: true
          title: '🚨 CRITICAL: {{ template "slack.default.title" . }}'
          text: |
            {{ range .Alerts }}
            *CRITICAL ALERT*
            *Summary:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Namespace:* {{ .Labels.namespace }}
            *Pod:* {{ .Labels.pod }}
            {{ end }}
          color: "danger"
      # Also send email for critical alerts
      emailConfigs:
        - to: "oncall@example.com"
          from: "alertmanager@example.com"
          smarthost: "smtp.gmail.com:587"
          authUsername: "alertmanager@example.com"
          authPassword:
            name: alertmanager-secrets
            key: smtp-password
          sendResolved: true
          headers:
            Subject: '[CRITICAL] {{ template "email.default.subject" . }}'

  # =====================================================
  # INHIBIT RULES: Suppress less severe alerts when critical fires
  # =====================================================
  inhibitRules:
    # If a critical alert is firing for the same namespace,
    # suppress warning alerts for the same namespace
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
      equal: ['namespace', 'job']
