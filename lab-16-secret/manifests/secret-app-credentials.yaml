# =============================================================================
# Secret: Application Credentials (Opaque type)
# Lab 16 — Secret
# ⚠️  Values are base64 encoded, NOT encrypted!
#     Never commit real secrets to Git!
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: secret-app-credentials
  namespace: lab16
  labels:
    app: webapp
    env: production
    lab: "16"
  annotations:
    description: "Application database and API credentials"
    # Rotation policy reminder
    last-rotated: "2024-01-15"
    rotate-every: "90d"
type: Opaque
data:
  # ── Encode: echo -n "value" | base64 ─────────────────────────────────────
  # DB_USER: admin
  DB_USER: YWRtaW4=

  # DB_PASSWORD: P@ssw0rd123!
  DB_PASSWORD: UEBzc3cwcmQxMjMh

  # DB_URL: postgresql://admin:P@ssw0rd123!@postgres:5432/mydb
  DB_URL: cG9zdGdyZXNxbDovL2FkbWluOlBAc3N3MHJkMTIzIUBwb3N0Z3Jlczo1NDMyL215ZGI=

  # API_KEY: sk-1234567890abcdef1234567890abcdef
  API_KEY: c2stMTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWY=

  # JWT_SECRET: my-super-secret-jwt-signing-key-256bits
  JWT_SECRET: bXktc3VwZXItc2VjcmV0LWp3dC1zaWduaW5nLWtleS0yNTZiaXRz

  # REDIS_PASSWORD: RedisP@ss!
  REDIS_PASSWORD: UmVkaXNQQHNzIQ==

  # SMTP_PASSWORD: smtp-secret-password
  SMTP_PASSWORD: c210cC1zZWNyZXQtcGFzc3dvcmQ=
---
# =============================================================================
# Secret: Using stringData (plain text - Kubernetes encodes automatically)
# Easier to write but same security level
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: secret-app-credentials-v2
  namespace: lab16
  labels:
    app: webapp
    lab: "16"
type: Opaque
stringData:
  # stringData: write plain text, Kubernetes encodes to base64 automatically
  # ⚠️ Still not encrypted at rest unless EncryptionConfiguration is enabled!
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "AdminP@ssw0rd!"
  INTERNAL_API_KEY: "internal-service-key-xyz"
  WEBHOOK_SECRET: "wh-secret-abc123"
