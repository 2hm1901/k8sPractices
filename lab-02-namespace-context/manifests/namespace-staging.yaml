# Namespace: staging (Staging / Pre-production Environment)
# Môi trường QA testing và integration testing
# Tài nguyên lớn hơn dev, nhỏ hơn prod

apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    environment: staging
    team: devops
    managed-by: kubectl
    cost-center: engineering
  annotations:
    description: "Staging environment - mirrors production for pre-release testing"
    owner: "platform-team@company.com"
    created-by: "lab-02-namespace-context"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"
    services: "20"
    secrets: "30"
    configmaps: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limitrange
  namespace: staging
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
    max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
  - type: Pod
    max:
      cpu: "4"
      memory: "4Gi"
