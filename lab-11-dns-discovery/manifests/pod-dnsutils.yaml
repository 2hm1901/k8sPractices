# manifests/pod-dnsutils.yaml
# Pod chuyên dụng để debug DNS trong Kubernetes
# Bao gồm: nslookup, dig, host, ping, curl, nc

apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  labels:
    app: dnsutils
    purpose: dns-debugging
spec:
  containers:
    - name: dnsutils
      # Image chứa đầy đủ DNS tools
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      # Giữ pod chạy
      command:
        - sleep
        - "infinity"
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  # Dùng ClusterFirst để query CoreDNS
  dnsPolicy: ClusterFirst
  restartPolicy: Always

---
