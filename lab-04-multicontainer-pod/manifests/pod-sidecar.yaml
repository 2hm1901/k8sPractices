apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pod
  labels:
    app: sidecar-demo
spec:
  containers:
  # Main application container - generates logs
  - name: main-app
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      mkdir -p /var/log/app
      i=1
      while true; do
        echo "$(date '+%Y-%m-%d %H:%M:%S') [INFO] Request #$i processed successfully" >> /var/log/app/app.log
        echo "$(date '+%Y-%m-%d %H:%M:%S') [DEBUG] Memory usage: $((RANDOM % 100))MB" >> /var/log/app/app.log
        i=$((i+1))
        sleep 3
      done
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/app
    resources:
      requests:
        cpu: "50m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  # Sidecar container - ships logs to stdout (simulating log aggregation)
  - name: log-tailer
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Log tailer started, waiting for log file..."
      while [ ! -f /var/log/app/app.log ]; do
        sleep 1
      done
      echo "Log file found! Tailing..."
      tail -f /var/log/app/app.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/app
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "32Mi"

  volumes:
  # emptyDir: created when Pod is assigned to a node, deleted when Pod is removed
  - name: shared-logs
    emptyDir: {}

  restartPolicy: Always
