apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  # Init containers run sequentially BEFORE main containers
  initContainers:

  # Init 1: Simulate waiting for a dependency service
  - name: init-check-service
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Checking if required service is available..."
      # Simulate checking for a service (in real world: nslookup myservice)
      for i in $(seq 1 3); do
        echo "Attempt $i: Checking service availability..."
        sleep 2
      done
      echo "Service is ready! Proceeding..."

  # Init 2: Download config/assets before main starts
  - name: init-download-config
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Downloading application configuration..."
      mkdir -p /config
      # Simulate downloading config
      cat > /config/app.conf <<EOF
      APP_ENV=production
      LOG_LEVEL=info
      MAX_CONNECTIONS=100
      TIMEOUT=30s
      EOF
      echo "Config downloaded successfully:"
      cat /config/app.conf
    volumeMounts:
    - name: config-volume
      mountPath: /config

  # Main container — starts only after all init containers complete
  containers:
  - name: main-app
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "=== Main application starting ==="
      echo "Reading configuration..."
      cat /config/app.conf
      echo "=== Application is running ==="
      while true; do
        echo "$(date): Application is healthy"
        sleep 10
      done
    volumeMounts:
    - name: config-volume
      mountPath: /config

  volumes:
  - name: config-volume
    emptyDir: {}

  restartPolicy: Always
