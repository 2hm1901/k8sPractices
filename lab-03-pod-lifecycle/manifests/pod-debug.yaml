# Pod Manifest: debug-pod
# Mục đích: Pod chạy lâu dài để thực hành debugging commands
# Có đầy đủ tools: curl, wget, nslookup, netstat, ps, ...
#
# Usage:
#   kubectl apply -f pod-debug.yaml -n dev
#   kubectl exec -it debug-pod -n dev -- sh
#   kubectl logs debug-pod -n dev -f

apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: dev
  labels:
    app: debug
    purpose: lab-practice
  annotations:
    description: "Long-running debug pod with network tools for practice"
spec:
  restartPolicy: Always

  containers:
  - name: debug-container
    # nicolaka/netshoot: Docker image đặc biệt có sẵn rất nhiều network tools
    # Gồm: curl, wget, nslookup, dig, netstat, ss, tcpdump, iperf, ...
    # Alternative: busybox, alpine, ubuntu
    image: nicolaka/netshoot:v0.11
    imagePullPolicy: IfNotPresent

    # Command: chạy sleep để pod tồn tại mãi
    command:
    - sleep
    - "infinity"   # Không timeout

    # Environment variables để demo
    env:
    - name: MY_VAR
      value: "hello-from-env"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

    # securityContext cho container
    securityContext:
      # runAsNonRoot: true     # Best practice - không chạy as root
      # runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false  # Cần false để debug tools hoạt động

    # volumeMounts để demo
    volumeMounts:
    - name: debug-data
      mountPath: /debug-data
    - name: host-info
      mountPath: /host-info
      readOnly: true

  volumes:
  - name: debug-data
    emptyDir: {}
  - name: host-info
    # hostPath: mount thư mục từ host node vào container
    # CẢNH BÁO: Nguy hiểm trong production, chỉ dùng cho debug
    hostPath:
      path: /etc
      type: Directory

---
# ─────────────────────────────────────────────────────────────────────────────
# Pod thứ 2: Ephemeral debug pod (dùng một lần rồi thôi)
# Thực hành: kubectl run và interactive shell
# ─────────────────────────────────────────────────────────────────────────────
# Ghi chú: Pod này được tạo bằng kubectl run command, không apply từ YAML:
#
# kubectl run ephemeral-debug \
#   --image=busybox:1.36 \
#   --restart=Never \
#   -it \
#   --rm \
#   -n dev \
#   -- sh
#
# --rm: Tự động xóa pod sau khi exit
# -it: Interactive terminal
# --restart=Never: Chạy một lần, không restart
