---
# Role: developer (Developer Pattern)
# Scope: Namespace-scoped (chỉ hoạt động trong rbac-lab namespace)
# Purpose: Developer có quyền CRUD với các resources thường dùng,
#          nhưng KHÔNG có quyền với secrets, RBAC resources, hay cluster resources
#
# Common pattern: Developer trong một team project
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: rbac-lab
  labels:
    rbac-level: developer
    env: lab
  annotations:
    description: "Developer access — CRUD on common workload resources, no secrets access"
rules:
  # ✅ Đầy đủ CRUD cho workloads
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec      # Cho phép exec vào pods (debugging)
      - pods/portforward
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ✅ Apps workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ✅ Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ✅ Batch jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ✅ Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ❌ KHÔNG có quyền với Secrets (sensitive data)
  # ❌ KHÔNG có quyền với RBAC resources
  # ❌ KHÔNG có quyền với cluster-level resources
