---
# ServiceAccount: app-service-account
# Dùng bởi các application pods trong namespace rbac-lab
# Best practice: mỗi application nên có ServiceAccount riêng,
# không dùng "default" ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: rbac-lab
  labels:
    app: demo-app
    env: lab
  annotations:
    description: "ServiceAccount for the demo application"
# Tắt auto-mount nếu pod không cần gọi Kubernetes API
# automountServiceAccountToken: false
