---
# Pod sử dụng ServiceAccount tùy chỉnh
# Thay vì dùng "default" ServiceAccount (không có quyền gì cụ thể),
# pod này dùng "app-service-account" đã được cấu hình RBAC đúng đắn
apiVersion: v1
kind: Pod
metadata:
  name: sa-demo-pod
  namespace: rbac-lab
  labels:
    app: sa-demo
    env: lab
  annotations:
    description: "Demo pod using custom ServiceAccount to access K8s API"
spec:
  # ✅ Dùng ServiceAccount tùy chỉnh thay vì "default"
  serviceAccountName: app-service-account

  # ✅ Tắt automount nếu pod không cần K8s API (security best practice)
  # Trong lab này, chúng ta CẦN token để test, nên để mặc định = true
  automountServiceAccountToken: true

  # ✅ Security context ở Pod level
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000

  containers:
    - name: main
      # Dùng image có curl để test API calls
      image: curlimages/curl:latest
      command: ["sleep", "3600"]  # Keep alive for testing

      # ✅ Security context ở Container level
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

      # Volume mount cho service account token (được mount tự động)
      # Đường dẫn mặc định: /var/run/secrets/kubernetes.io/serviceaccount/
      # Trong đó có: token, ca.crt, namespace

  restartPolicy: Never
