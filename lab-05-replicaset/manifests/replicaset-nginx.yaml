apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  namespace: lab05
  labels:
    app: nginx
    managed-by: lab05
spec:
  # Số lượng Pod replicas mong muốn
  replicas: 3

  # Selector để ReplicaSet tìm/nhận nuôi Pods
  # PHẢI khớp với spec.template.metadata.labels
  selector:
    matchLabels:
      app: nginx

  # Template để tạo Pod mới khi cần
  template:
    metadata:
      labels:
        app: nginx       # Phải match với selector.matchLabels
        version: "1.0"
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine
        ports:
        - containerPort: 80
          name: http
        # Resource requests/limits (best practice)
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        # Liveness probe — kiểm tra container còn sống không
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        # Readiness probe — kiểm tra container sẵn sàng nhận traffic chưa
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      # Graceful termination
      terminationGracePeriodSeconds: 30
