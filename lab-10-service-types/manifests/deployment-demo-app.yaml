# manifests/deployment-demo-app.yaml
# Demo application Deployment để test các Service types
# Dùng một HTTP server đơn giản trả về hostname của pod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
    version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-app
        version: "1.0"
    spec:
      containers:
        - name: demo-app
          # hashicorp/http-echo trả về text đơn giản
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from $(POD_NAME) in $(POD_NAMESPACE)"
            - "-listen=:8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      terminationGracePeriodSeconds: 30
