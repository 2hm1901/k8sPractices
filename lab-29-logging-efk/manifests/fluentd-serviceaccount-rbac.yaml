# fluentd-serviceaccount-rbac.yaml
# Fluentd needs permissions to:
# - List and watch pods (to enrich logs with K8s metadata)
# - List namespaces
# These are cluster-scoped resources, so we need ClusterRole + ClusterRoleBinding

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd
    component: logging

---
# ClusterRole grants read access to pods and namespaces across ALL namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
  labels:
    app: fluentd
    component: logging
rules:
  # Pod metadata enrichment: Fluentd reads pod info to add labels to log entries
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
  # Allow reading node info for additional context
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list

---
# Bind the ClusterRole to the fluentd ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
  labels:
    app: fluentd
    component: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
