# fluentd-daemonset.yaml
# DaemonSet ensures ONE Fluentd pod runs on EVERY node
# This is the standard pattern for node-level log collection

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd
    component: logging
    version: "v1.16"
spec:
  selector:
    matchLabels:
      app: fluentd
  # Rolling update: update one node at a time
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: fluentd
        component: logging
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: "{{ include (print $.Template.BasePath '/fluentd-configmap.yaml') . | sha256sum }}"
    spec:
      # Use our RBAC service account
      serviceAccountName: fluentd

      # Run on every node including control-plane
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        # Tolerate any taint (collect logs even from tainted nodes)
        - operator: "Exists"
          effect: "NoSchedule"

      # Terminate gracefully - flush buffered logs before exit
      terminationGracePeriodSeconds: 30

      containers:
        - name: fluentd
          # Use the official Kubernetes-ready Fluentd image
          image: fluent/fluentd-kubernetes-daemonset:v1.16-debian-elasticsearch8-1
          imagePullPolicy: IfNotPresent

          env:
            # Elasticsearch connection (matches our service name)
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "elasticsearch.logging.svc.cluster.local"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
            - name: FLUENT_ELASTICSEARCH_SCHEME
              value: "http"

            # Index naming
            - name: FLUENT_ELASTICSEARCH_LOGSTASH_PREFIX
              value: "logstash"

            # Disable SSL verification for lab
            - name: FLUENT_ELASTICSEARCH_SSL_VERIFY
              value: "false"

            # Buffer directory
            - name: FLUENT_CONTAINER_TAIL_PARSER_TYPE
              value: "cri"

            # Node name for log enrichment
            - name: FLUENTD_SYSTEMD_CONF
              value: "disable"

            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            # Fluentd is I/O bound, not CPU-heavy
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            # Mount the node's container log directory
            - name: varlog
              mountPath: /var/log

            # Mount the node's docker data directory (Docker runtime)
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

            # Mount our custom Fluentd config
            - name: config-volume
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf

            # Persistent buffer storage (survives pod restarts)
            - name: fluentd-buffer
              mountPath: /var/log/fluentd-buffers

          # Security context: run as root to access host log files
          securityContext:
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH  # Read files owned by other users

      volumes:
        # Host /var/log directory (contains container logs)
        - name: varlog
          hostPath:
            path: /var/log

        # Docker container filesystem (for log files)
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

        # Our Fluentd configuration
        - name: config-volume
          configMap:
            name: fluentd-config

        # Buffer storage on host (persistent across pod restarts)
        - name: fluentd-buffer
          hostPath:
            path: /var/log/fluentd-buffers
            type: DirectoryOrCreate
