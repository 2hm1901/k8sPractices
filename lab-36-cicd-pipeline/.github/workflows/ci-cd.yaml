name: CI/CD Pipeline — Build, Push & Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/my-webapp

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        # npm test  or  go test ./...  or  pytest
        echo "All tests passed!"

  # ── Job 2: Build & Push Docker Image ────────────────────────
  build-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=ref,event=branch
          type=semver,pattern={{version}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Dev ─────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > /tmp/kubeconfig
        echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

    - name: Update image tag in dev overlay
      run: |
        cd lab-36-cicd-pipeline/manifests/overlays/dev
        # Update kustomization with new image tag
        kustomize edit set image nginx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}

    - name: Deploy to dev
      run: |
        kubectl apply -k lab-36-cicd-pipeline/manifests/overlays/dev/
        kubectl rollout status deployment/dev-my-webapp -n my-app-dev --timeout=5m

    - name: Commit updated kustomization
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add lab-36-cicd-pipeline/manifests/overlays/dev/kustomization.yaml
        git commit -m "chore(dev): update image to ${{ needs.build-push.outputs.image-tag }}" || true
        git push

  # ── Job 4: Deploy to Prod (manual approval) ─────────────────
  deploy-prod:
    name: Deploy to Production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod  # Requires manual approval in GitHub Settings
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > /tmp/kubeconfig
        echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

    - name: Deploy to prod
      run: |
        kustomize edit set image nginx=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}
        kubectl apply -k lab-36-cicd-pipeline/manifests/overlays/prod/
        kubectl rollout status deployment/prod-my-webapp -n my-app-prod --timeout=10m

    - name: Verify production deployment
      run: |
        kubectl get pods -n my-app-prod
        kubectl get svc -n my-app-prod
